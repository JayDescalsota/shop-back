repos:
  - repo: local
    hooks:
      - id: goimports
        name: goimports
        entry: goimports
        args: ["-w", "./..."]
        language: golang
        types: [go]
        pass_filenames: false
        require_serial: true

      - id: go-vet
        name: go vet
        entry: go vet
        args: ["./..."]
        language: golang
        types: [go]
        pass_filenames: false
        require_serial: true

      - id: go-build
        name: go build
        entry: go build
        args: ["./..."]
        language: golang
        types: [go]
        pass_filenames: false
        require_serial: true

      - id: go-mod-tidy
        name: go mod tidy (check)
        entry: bash -c "go mod tidy && git diff --exit-code go.mod go.sum"
        language: golang
        types: [go]
        pass_filenames: false
        require_serial: true
        always_run: true

      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run
        args: ["--timeout", "5m", "./..."]
        language: golang
        types: [go]
        pass_filenames: false
        require_serial: true
